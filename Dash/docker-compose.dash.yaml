version: "3.8"

services:
  dash-app:
    build: .
    container_name: dash-application
    ports:
      - "8050:8050"           
    volumes:
      - ./:/app             
      - ./data:/app/data     
    environment:
      - FLASK_ENV=development
    restart: unless-stopped   
    healthcheck:              
      test: ["CMD", "curl", "-f", "http://localhost:8050"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - offres_emplois_dakar
    command: ["python", "app.py"]