version: '3.8'

services:

  ##-------- Service de la gestion des dags (Stockages des dags) -----------------------####
 
  ### ---- Nous utlisons ici une base de données Postgres pour stocker nos dags -------###
  postgres:
     image: postgres:13
     container_name: postgres_dag1
     environment:
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
     env_file:
        - .env
     networks:
       - offres_emplois_dakar


###---------- Orchestration avec Airflow ---------------#######
  airflow-db-init:
     #image: apache/airflow:2.9.0
     build:
       context: .
       dockerfile: Dockerfile 
     image: airflow-with-scrapy 
     depends_on:
       - postgres
     env_file:
       - .env 
     environment:
        # AIRFLOW_CONN_SPARK_DEFAULT: spark://spark://spark-master:7077
        AIRFLOW__CORE__SQL_ALCHEMY_CONN: ${AIRFLOW__CORE__SQL_ALCHEMY_CONN}
        AIRFLOW__WEBSERVER__SECRET_KEY: '34f9a2c7e6b94b11a3f9a6b5a2c7d1e2'
        AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
        AIRFLOW__LOGGING__DAG_PROCESSOR_MANAGER_LOG_LOCATION: /opt/airflow/logs/dag_processor_manager/dag_processor_manager.log
        PYTHONPATH: /opt/airflow/src
     volumes:
       - ../Airflow/dags:/opt/airflow/dags
       - ../Airflow/logs:/opt/airflow/logs
       - ../Scraping_job:/opt/airflow/scrapjob:rw
       - ../Dossiers_json_excel_csv:/opt/airflow/Dossiers_json_excel_csv
       - ../Dossiers_json_excel_csv/json_fichiers:/opt/airflow/Dossiers_json_excel_csv/donnes_des_json:rw # stocker nos fichier json
       - ../src:/opt/airflow/src:rw
       - /etc/localtime:/etc/localtime:ro
     restart: unless-stopped 

     networks:
        - offres_emplois_dakar
       

     entrypoint: 
       bash -c " airflow db init && 
       airflow db migrate && 
       airflow users create \
        --username ${username} \
        --password ${password} \
        --firstname ${firstname} \
        --lastname ${lastname} \
        --role ${role} \
        --email ${email}"
  
  # interface graphique de airflow 
  airflow-webserver:
     #image: apache/airflow:2.9.0
     build:
       context: .
       dockerfile: Dockerfile 
     image: airflow-with-scrapy
     container_name: airflow_web1
     ports:
       - ${Port_externe_Airflow}:8080
     depends_on:
       - postgres
     env_file:
       - .env 
     environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__PARALLELISM: 32 # nombre dag a lancer en parallele  
        AIRFLOW__CORE__DAG_CONCURRENCY: 16  #nombre de tache a lancer en parallele par dag 
        AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 16
        AIRFLOW__CORE__SQL_ALCHEMY_CONN: ${AIRFLOW__CORE__SQL_ALCHEMY_CONN}
        AIRFLOW__WEBSERVER__SECRET_KEY: '34f9a2c7e6b94b11a3f9a6b5a2c7d1e2'
        AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
        AIRFLOW__LOGGING__DAG_PROCESSOR_MANAGER_LOG_LOCATION: /opt/airflow/logs/dag_processor_manager/dag_processor_manager.log
        # AIRFLOW_CONN_SPARK_DEFAULT: spark://spark://spark-master:7077

        PYTHONPATH: /opt/airflow/src   
     volumes:
       - ./dags:/opt/airflow/dags
       - ./logs:/opt/airflow/logs
       - ../Scraping_job:/opt/airflow/scrapjob:rw
       - ../src:/opt/airflow/src:rw
       - ../Dossiers_json_excel_csv:/opt/airflow/Dossiers_json_excel_csv
       - /etc/localtime:/etc/localtime:ro
       - /Spark/airflow_ssh:/home/airflow/.ssh

     command: airflow webserver

     networks:
       - offres_emplois_dakar

  # gestionnaires des taches automatiquement (avec scheduler)
  airflow-scheduler: 
     #image: apache/airflow:2.9.0
     build:
        context: .
        dockerfile: Dockerfile 
     image: airflow-with-scrapy
     container_name: mon_scheduler_job
     restart: always 
     depends_on:
       - airflow-webserver
     env_file:
       - .env 
     volumes:
       - ./dags:/opt/airflow/dags
       - ./logs:/opt/airflow/logs
       - ../Scraping_job:/opt/airflow/scrapjob:rw
       - ../src:/opt/airflow/src:rw
       - ../Dossiers_json_excel_csv:/opt/airflow/Dossiers_json_excel_csv
       - ../Dossiers_json_excel_csv/json_files:/opt/airflow/donnes_des_json:rw # stocker nos fichier json
       - /etc/localtime:/etc/localtime:ro
     environment:
          AIRFLOW__CORE__SQL_ALCHEMY_CONN: ${AIRFLOW__CORE__SQL_ALCHEMY_CONN}
          AIRFLOW__WEBSERVER__SECRET_KEY: '34f9a2c7e6b94b11a3f9a6b5a2c7d1e2'
          AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
          AIRFLOW__LOGGING__DAG_PROCESSOR_MANAGER_LOG_LOCATION: /opt/airflow/logs/dag_processor_manager/dag_processor_manager.log
          # AIRFLOW_CONN_SPARK_DEFAULT: spark://spark://spark-master:7077
          PYTHONPATH: /opt/airflow/src
     command: airflow scheduler 

     networks:
       - offres_emplois_dakar
  


### --------------------------  Probleme rencontré -------------------------- ###

# Notre utilisation de Airflow avec le docker-compose a rencontré des problèmes liés aux permissions d'ecrire les logs 
# Et pour resoudre ce probleme, nous avons du modifier les permissions des dossiers de logs en utilisant la commande suivante :
            
              # sudo chown -R 50000:50000 ../Airflow/logs
              # sudo chmod -R 775 ../Airflow/logs
